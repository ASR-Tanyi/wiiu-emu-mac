name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS arm64 (${{ matrix.preset }})
    runs-on: macos-15          # Apple silicon runner — see ADR-002
    strategy:
      fail-fast: false
      matrix:
        preset: [macos-debug, macos-release]
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: brew install ninja ccache

      - name: Cache dependencies and objects
        uses: actions/cache@v4
        with:
          path: |
            ~/.ccache
            build/${{ matrix.preset }}/_deps
          key: ${{ runner.os }}-${{ matrix.preset }}-${{ hashFiles('cmake/Dependencies.cmake') }}
          restore-keys: ${{ runner.os }}-${{ matrix.preset }}-

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset macos-debug
        if: matrix.preset == 'macos-debug'

      - name: Smoke-test the binary
        run: ./build/${{ matrix.preset }}/bin/wiiu-emu --version

  # The platform-independent core must keep building without a Mac: it is what
  # makes the CPU, loader and memory subsystems testable anywhere.
  core:
    name: Core only (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        # binutils-powerpc-linux-gnu powers the disassembler round-trip test
        # (tests/CMakeLists.txt); without it that test reports itself skipped.
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache binutils-powerpc-linux-gnu

      - name: Configure
        run: cmake --preset core-debug

      - name: Build
        run: cmake --build --preset core-debug

      - name: Test
        run: ctest --preset core-debug

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: |
          find src tests -name '*.cpp' -o -name '*.hpp' -o -name '*.mm' \
            | xargs clang-format --dry-run --Werror
